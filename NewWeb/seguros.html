<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguros | Grupo Alfa</title>
    <link rel="icon" type="image/png" href="/assets/logo-grupo-alfa-cabeza-negra-mv02n2ZjzOc5pE3k.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/src/seguros.css" />
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #000;
        }

        .site-header {
            background-color: #fff;
        }
    </style>
</head>

<body class="seguros-page">
    <!-- Header -->
          <header class="site-header" id="header">
    <div class="container nav-container">
      <a href="/" class="logo">
        <img src="/assets/logo-grupo-alfa-cabeza-negra-mv02n2ZjzOc5pE3k.png" alt="Grupo Alfa" />
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">INICIO</a></li>
          <li><a href="/proyectos">PROYECTOS</a></li>
          <li><a href="/promotores">PROMOTORES</a></li>
          <li><a href="/inversores">INVERSORES</a></li>
          <li><a href="/alfa-hunters">ALFA HUNTERS</a></li>
          <li><a href="/contacto">CONTACTO</a></li>
        </ul>
        <div class="mobile-menu-toggle"><span></span><span></span><span></span></div>
      </nav>
    </div>
  </header>

    <main class="seguros-main">
        <div class="container">
            <div class="seguros-grid fade-in">
                <!-- Left Column -->
                <div class="seguros-col-left">
                    <!-- Logo (Desktop) / Logo Text (Mobile) handled via CSS or distinct elements -->
                    <div class="seguros-logo-wrapper">
                        <img src="/assets/logo-grupo-alfa-horizontal-montado-blanco-lhGvXrpDul9kdik1.png"
                            alt="Grupo Alfa Seguros" class="seguros-logo-desktop" />
                        <img src="/assets/logo-grupo-alfa-texto-blanco-e3qvGVvZFnhF9AGz.png"
                            alt="Grupo Alfa Seguros" class="seguros-logo-mobile" />
                    </div>

                    <div class="seguros-image-1">
                        <img src="/assets/6-xagwOQuvpmdAZmfW.png" alt="Seguros Familia" />
                    </div>
                </div>

                <!-- Right Column -->
                <div class="seguros-col-right">
                    <div class="seguros-image-2">
                        <img src="/assets/7-ucrml6fvi2VS6Vcd.png" alt="Seguros Protección" />
                    </div>

                    <div class="seguros-image-3">
                        <img src="/assets/8-2TH51lWR8ULK9DcB.png" alt="Seguros Hogar" />
                    </div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="seguros-back-container fade-in">
                <a href="/#submarcas" class="seguros-btn-back">Volver</a>
            </div>
        </div>
    </main>

    <footer class="site-footer"
        style="background: url('/assets/photo-1707903244219-8ed71537554d3d83.jpg') no-repeat center center/cover; position: relative; padding: 100px 0;">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);"></div>
        <div class="container footer-content" style="position: relative; z-index: 1;">
            <div class="footer-logo">
                <img src="/assets/logo-grupo-alfa-horizontal-negro-A0xjZ3p5p7TZrR4K.png"
                    style="filter: brightness(0) invert(1);" alt="Grupo Alfa Footer" />
                <p style="margin-top: 20px; opacity: 0.7; color: #fff;">
                    C/ Conde del Valle de San Juan, 1<br>
                    30004, Murcia
                </p>
            </div>
            <div class="footer-links" style="color: #fff;">
                <h4>CONTACTO</h4>
                <p><a href="mailto:info@grupoalfa.net">info@grupoalfa.net</a></p>
                <p><a href="mailto:luciomerlini@grupoalfa.net">luciomerlini@grupoalfa.net</a></p>
                <p><a href="mailto:joseantonio@grupoalfa.net">joseantonio@grupoalfa.net</a></p>
            </div>
        </div>
    </footer>

    
    
  <script type="module" src="/main.js"></script>
